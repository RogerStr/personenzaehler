[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    pololu/VL53L1X@^1.3.1
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8

; Update über WLAN:  pio run -e d1_mini_ota -t upload
; upload_port = Hostname (.local) oder IP des Zählers, --auth = Admin-Passwort aus der Konfig
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = personenzaehler.local
upload_flags =
    --auth=zaehler1
